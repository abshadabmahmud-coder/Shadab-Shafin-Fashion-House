name = "shadab-shafin-fashion-house"
pages_build_output_dir = "."
compatibility_date = "2026-01-01"

# D1 বাইন্ডিং ইচ্ছাকৃতভাবে এখানে রাখা হয়নি — Cloudflare Pages Git-কানেক্টেড ডিপ্লয়মেন্টেও
# এই ফাইলটা পড়ে, এবং placeholder database_id থাকলে ডিপ্লয় স্টেপে
# "Invalid database UUID" এরর দিয়ে ব্যর্থ হয়। D1 বাইন্ডিং করতে হবে Dashboard থেকে:
# Settings → Functions → D1 database bindings → variable name অবশ্যই DB।
#
# শুধু লোকালি `wrangler pages dev` দিয়ে টেস্ট করতে চাইলে, নিচের ব্লকটা আনকমেন্ট করে
# `wrangler d1 create` থেকে পাওয়া আসল database_id বসান (তবে এটা কমিট/পুশ করবেন না,
# নাহলে আবার একই এরর দেখা দেবে):
#
# [[d1_databases]]
# binding = "DB"
# database_name = "shadab-shafin-db"
# database_id = "আপনার-আসল-database-id-এখানে"
