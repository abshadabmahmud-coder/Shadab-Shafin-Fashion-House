<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার অর্ডার — শাদাব-শাফিন ফ্যাশন হাউস</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
:root{--ink:#1C1410;--ivory:#FBF6EC;--gold:#B8933E;--gold-light:#E4C97A;--maroon:#6B1420;--maroon-deep:#4A0D16;--taupe:#A99985;--blush:#F1E4D2;--line:#E6D8C0;--line-strong:#D6C39F;--muted:#8A7A6B;--error:#8B4A2B;--success:#4A5D3A;--bg:#F3EBDA;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',sans-serif;font-size:14px;line-height:1.6;}
.serif{font-family:'Noto Serif Bengali',serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:13px;}
.container{max-width:640px;margin:0 auto;padding:0 20px;}
.topbar{background:var(--maroon-deep);color:var(--ivory);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:640px;margin:0 auto;padding:0 20px;}
.logo{font-family:'Noto Serif Bengali',serif;letter-spacing:.01em;font-size:17px;}
.logo a{opacity:.9;}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;width:100%;}
.btn-primary{background:var(--maroon-deep);color:var(--ivory);}
.btn-primary:hover{opacity:.9;}
.btn-outline{border:1px solid var(--line-strong);color:var(--ink);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.card{background:var(--ivory);border:1px solid var(--line);padding:24px;margin-bottom:20px;}
.form-input{width:100%;padding:12px 14px;border:1px solid var(--line-strong);background:transparent;outline:none;margin-bottom:12px;}
.form-input:focus{border-color:var(--ink);}
.tabs{display:flex;border:1px solid var(--line-strong);margin-bottom:20px;}
.tab{flex:1;text-align:center;padding:12px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.tab.active{background:var(--maroon-deep);color:var(--ivory);}
.msg{font-size:12.5px;margin:-4px 0 12px;}
.msg.error{color:var(--error);}
.msg.success{color:var(--success);}
.order-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.order-item:last-child{border-bottom:none;}
.status-badge{display:inline-block;padding:4px 10px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;background:var(--blush);color:var(--maroon-deep);}
.status-badge.Delivered{background:#DCE7D6;color:var(--success);}
.status-badge.Cancelled{background:#EFD8D2;color:var(--error);}
.timeline{display:flex;justify-content:space-between;margin:20px 0;position:relative;}
.timeline::before{content:"";position:absolute;top:9px;left:0;right:0;height:2px;background:var(--line-strong);z-index:0;}
.tl-step{flex:1;text-align:center;position:relative;z-index:1;}
.tl-dot{width:18px;height:18px;border-radius:50%;background:var(--ivory);border:2px solid var(--line-strong);margin:0 auto 6px;}
.tl-step.done .tl-dot{background:var(--maroon-deep);border-color:var(--maroon-deep);}
.tl-label{font-size:10.5px;color:var(--muted);}
.tl-step.done .tl-label{color:var(--ink);}
.order-card{background:var(--ivory);border:1px solid var(--line);padding:16px;margin-bottom:12px;cursor:pointer;}
.order-card:hover{border-color:var(--line-strong);}
.order-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.muted{color:var(--muted);font-size:12px;}
.link-btn{font-size:12.5px;color:var(--maroon-deep);text-decoration:underline;background:none;}
.empty-state{text-align:center;color:var(--muted);font-size:13px;padding:30px 0;}
.back-link{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:inline-block;margin-bottom:16px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="/">শাদাব-শাফিন ফ্যাশন হাউস</a>
    <a href="/" style="font-size:12px;letter-spacing:.05em;text-transform:uppercase;">← হোমে ফিরুন</a>
  </div>
</div>

<div class="container" style="padding:32px 20px 60px;">
  <h1 class="serif" style="font-size:26px;margin-bottom:4px;">আমার অর্ডার</h1>
  <p class="muted" style="margin-bottom:24px;">অর্ডার ট্র্যাক করুন অথবা লগইন করে আপনার অর্ডার হিস্টোরি দেখুন</p>

  <div class="tabs">
    <button class="tab" id="tabTrack" onclick="switchTab('track')">অর্ডার ট্র্যাক করুন</button>
    <button class="tab" id="tabAccount" onclick="switchTab('account')">লগইন / অ্যাকাউন্ট</button>
  </div>

  <div id="panelTrack"></div>
  <div id="panelAccount"></div>
</div>

<script>
const API = "";
const TOKEN_KEY = "ssfh_customer_token";
let activeTab = "track";
let accountMode = "login"; // login | register | history | detail
let currentDetail = null;

function switchTab(t){
  activeTab = t;
  document.getElementById("tabTrack").classList.toggle("active", t==="track");
  document.getElementById("tabAccount").classList.toggle("active", t==="account");
  document.getElementById("panelTrack").style.display = t==="track" ? "block" : "none";
  document.getElementById("panelAccount").style.display = t==="account" ? "block" : "none";
  if(t==="track") renderTrack(); else renderAccount();
}

function fmt(n){ return "৳" + Number(n||0).toLocaleString("en-IN"); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString("bn-BD", {year:"numeric", month:"short", day:"numeric"}); }

const STEPS = ["Pending","Processing","Shipped","Delivered"];
function renderTimeline(status){
  if(status === "Cancelled"){
    return `<p class="status-badge Cancelled" style="margin:16px 0;">এই অর্ডারটি বাতিল করা হয়েছে</p>`;
  }
  const idx = STEPS.indexOf(status);
  const labels = {Pending:"গৃহীত", Processing:"প্রস্তুত হচ্ছে", Shipped:"পাঠানো হয়েছে", Delivered:"পৌঁছেছে"};
  return `<div class="timeline">${STEPS.map((s,i)=>`
    <div class="tl-step ${i<=idx?'done':''}">
      <div class="tl-dot"></div>
      <div class="tl-label">${labels[s]}</div>
    </div>`).join("")}</div>`;
}

function renderOrderDetail(o){
  const items = o.items.map(it=>`
    <div class="order-item"><span>${it.name} (${it.color}, ${it.size}) x${it.qty}</span><span>${fmt(it.price*it.qty)}</span></div>
  `).join("");
  return `
    <div class="card">
      <div class="order-card-top">
        <p class="serif" style="font-size:18px;">${o.order_id}</p>
        <span class="status-badge ${o.status}">${o.status}</span>
      </div>
      <p class="muted" style="margin-bottom:10px;">${fmtDate(o.created_at)}</p>
      ${renderTimeline(o.status)}
      <p style="font-size:12.5px;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.05em;">পণ্য</p>
      ${items}
      <div class="order-item" style="border-top:1px solid var(--line-strong);margin-top:8px;padding-top:10px;font-weight:600;">
        <span>মোট</span><span>${fmt(o.total)}</span>
      </div>
      ${o.address ? `<p style="font-size:12.5px;color:var(--muted);margin-top:14px;">ঠিকানা: ${o.address}${o.area?', '+o.area:''}${o.district?', '+o.district:''}</p>` : ''}
    </div>`;
}

/* ---------- TRACK TAB ---------- */
function renderTrack(){
  const el = document.getElementById("panelTrack");
  el.innerHTML = `
    <div class="card">
      <input class="form-input" id="trackOrderId" placeholder="অর্ডার আইডি (যেমন SSFH-123456)">
      <input class="form-input" id="trackPhone" placeholder="মোবাইল নাম্বার" inputmode="numeric">
      <div id="trackMsg" class="msg error"></div>
      <button class="btn btn-primary" onclick="doTrack()">ট্র্যাক করুন</button>
    </div>
    <div id="trackResult"></div>`;

  // URL-এ ?order_id=...&phone=... থাকলে অটো-ফিল করে সাথে সাথে ট্র্যাক করুন (অর্ডার কনফার্মেশন থেকে আসলে)
  const params = new URLSearchParams(location.search);
  if(params.get("order_id")){
    document.getElementById("trackOrderId").value = params.get("order_id");
    if(params.get("phone")) document.getElementById("trackPhone").value = params.get("phone");
    doTrack();
  }
}

async function doTrack(){
  const orderId = document.getElementById("trackOrderId").value.trim();
  const phone = document.getElementById("trackPhone").value.trim();
  const msgEl = document.getElementById("trackMsg");
  const resultEl = document.getElementById("trackResult");
  msgEl.textContent = ""; resultEl.innerHTML = "";
  if(!orderId || !phone){ msgEl.textContent = "অর্ডার আইডি ও মোবাইল নাম্বার দুটোই দিন।"; return; }
  try{
    const res = await fetch(`/api/orders/track?order_id=${encodeURIComponent(orderId)}&phone=${encodeURIComponent(phone)}`);
    const data = await res.json();
    if(!res.ok){ msgEl.textContent = data.error || "অর্ডার পাওয়া যায়নি।"; return; }
    resultEl.innerHTML = renderOrderDetail(data);
  }catch(e){
    msgEl.textContent = "সার্ভারে সমস্যা হয়েছে, একটু পর আবার চেষ্টা করুন।";
  }
}

/* ---------- ACCOUNT TAB ---------- */
function renderAccount(){
  const token = localStorage.getItem(TOKEN_KEY);
  if(token && accountMode !== "detail"){ accountMode = "history"; loadHistory(); return; }
  if(accountMode === "login") return renderLogin();
  if(accountMode === "register") return renderRegister();
  if(accountMode === "history") return; // loadHistory handles render
  if(accountMode === "detail") return; // renderDetailView handles render
}

function renderLogin(){
  const el = document.getElementById("panelAccount");
  el.innerHTML = `
    <div class="card">
      <input class="form-input" id="loginPhone" placeholder="মোবাইল নাম্বার" inputmode="numeric">
      <input class="form-input" id="loginPassword" type="password" placeholder="পাসওয়ার্ড">
      <div id="loginMsg" class="msg error"></div>
      <button class="btn btn-primary" onclick="doLogin()">লগইন করুন</button>
      <p style="text-align:center;margin-top:14px;font-size:12.5px;">নতুন গ্রাহক? <button class="link-btn" onclick="accountMode='register';renderAccount();">সাইন আপ করুন</button></p>
    </div>`;
}

function renderRegister(){
  const el = document.getElementById("panelAccount");
  el.innerHTML = `
    <div class="card">
      <input class="form-input" id="regName" placeholder="আপনার পুরো নাম">
      <input class="form-input" id="regPhone" placeholder="মোবাইল নাম্বার" inputmode="numeric">
      <input class="form-input" id="regPassword" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ ক্যারেক্টার)">
      <div id="regMsg" class="msg error"></div>
      <button class="btn btn-primary" onclick="doRegister()">অ্যাকাউন্ট তৈরি করুন</button>
      <p style="text-align:center;margin-top:14px;font-size:12.5px;">আগে থেকেই অ্যাকাউন্ট আছে? <button class="link-btn" onclick="accountMode='login';renderAccount();">লগইন করুন</button></p>
    </div>`;
}

async function doLogin(){
  const phone = document.getElementById("loginPhone").value.trim();
  const password = document.getElementById("loginPassword").value;
  const msgEl = document.getElementById("loginMsg");
  msgEl.textContent = "";
  try{
    const res = await fetch("/api/customer/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({phone, password})});
    const data = await res.json();
    if(!res.ok){ msgEl.textContent = data.error || "লগইন ব্যর্থ হয়েছে।"; return; }
    localStorage.setItem(TOKEN_KEY, data.token);
    accountMode = "history";
    renderAccount();
  }catch(e){ msgEl.textContent = "সার্ভারে সমস্যা হয়েছে, একটু পর আবার চেষ্টা করুন।"; }
}

async function doRegister(){
  const name = document.getElementById("regName").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const password = document.getElementById("regPassword").value;
  const msgEl = document.getElementById("regMsg");
  msgEl.textContent = "";
  try{
    const res = await fetch("/api/customer/register", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name, phone, password})});
    const data = await res.json();
    if(!res.ok){ msgEl.textContent = data.error || "সাইন আপ ব্যর্থ হয়েছে।"; return; }
    localStorage.setItem(TOKEN_KEY, data.token);
    accountMode = "history";
    renderAccount();
  }catch(e){ msgEl.textContent = "সার্ভারে সমস্যা হয়েছে, একটু পর আবার চেষ্টা করুন।"; }
}

function doLogout(){
  const token = localStorage.getItem(TOKEN_KEY);
  fetch("/api/customer/logout", {method:"POST", headers:{"Authorization":"Bearer "+token}}).catch(()=>{});
  localStorage.removeItem(TOKEN_KEY);
  accountMode = "login";
  renderAccount();
}

async function loadHistory(){
  const el = document.getElementById("panelAccount");
  el.innerHTML = `<p class="muted">লোড হচ্ছে…</p>`;
  const token = localStorage.getItem(TOKEN_KEY);
  try{
    const [meRes, ordersRes] = await Promise.all([
      fetch("/api/customer/me", {headers:{"Authorization":"Bearer "+token}}),
      fetch("/api/customer/orders", {headers:{"Authorization":"Bearer "+token}}),
    ]);
    if(!meRes.ok){ localStorage.removeItem(TOKEN_KEY); accountMode="login"; renderAccount(); return; }
    const me = await meRes.json();
    const orders = ordersRes.ok ? await ordersRes.json() : [];
    const list = orders.length === 0
      ? `<div class="empty-state">এখনো কোনো অর্ডার নেই।</div>`
      : orders.map(o=>`
        <div class="order-card" onclick='showDetail(${JSON.stringify(o).replace(/'/g,"&#39;")})'>
          <div class="order-card-top">
            <span class="serif" style="font-size:15px;">${o.order_id}</span>
            <span class="status-badge ${o.status}">${o.status}</span>
          </div>
          <div class="order-card-top">
            <span class="muted">${fmtDate(o.created_at)}</span>
            <span>${fmt(o.total)}</span>
          </div>
        </div>`).join("");
    el.innerHTML = `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        <div><p class="serif" style="font-size:16px;">${me.name}</p><p class="muted">${me.phone}</p></div>
        <button class="link-btn" onclick="doLogout()">লগআউট</button>
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;">অর্ডার হিস্টোরি</p>
      ${list}`;
  }catch(e){
    el.innerHTML = `<p class="msg error">সার্ভারে সমস্যা হয়েছে, একটু পর আবার চেষ্টা করুন।</p>`;
  }
}

function showDetail(o){
  currentDetail = o;
  accountMode = "detail";
  const el = document.getElementById("panelAccount");
  el.innerHTML = `<a class="back-link" onclick="accountMode='history';renderAccount();loadHistory();">← হিস্টোরিতে ফিরুন</a>` + renderOrderDetail(o);
}

/* init */
switchTab("track");
</script>
</body>
</html>
